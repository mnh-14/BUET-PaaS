apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/component: grafana-dashboard
    app.kubernetes.io/part-of: buet-paas-monitoring
    grafana_dashboard: "1"

configMapGenerator:
  - name: grafana-dashboard-buet-paas-overview
    files:
      - buet-paas-overview.json
